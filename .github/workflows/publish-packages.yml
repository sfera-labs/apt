name: Publish module packages

on:
  workflow_dispatch:
    inputs:
      module:
        description: Repository name under sfera-labs (e.g. strato-pi-max-kernel-module), or all
        type: choice
        required: true
        options:
          - all
          - iono-pi-kernel-module
          - iono-pi-max-kernel-module
          - iono-pi-v3-kernel-module
          - max14912-kernel-module
          - rtc-pcf2131
          - strato-pi-fan-kernel-module
          - strato-pi-kernel-module
          - strato-pi-max-kernel-module
          - strato-pi-plus-kernel-module
          # - exo-sense-pi-kernel-module
      version:
        description: Exact Debian package version (e.g. 1.35-1); leave blank for latest in selected suite
        type: string
        required: false
      suite:
        description: Publish to testing, or promote from testing to stable
        type: choice
        required: true
        default: testing
        options:
          - testing
          - stable

permissions:
  contents: read

concurrency:
  group: apt-site
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MODULE: ${{ inputs.module }}
      VERSION: ${{ inputs.version }}
      SUITE: ${{ inputs.suite }}
      APT_SITE_URL: ${{ vars.APT_SITE_URL || 'https://apt.sferalabs.cc' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out apt repository
        uses: actions/checkout@v5

      - name: Install repository tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils curl dpkg-dev gnupg gpgv jq

      - name: Publish or promote module packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          bash scripts/apt-site.sh publish-selection "$MODULE" "$VERSION" "$SUITE"
